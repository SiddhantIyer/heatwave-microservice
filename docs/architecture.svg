<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#34505a"/></marker></defs>
  <rect width="960" height="600" fill="#f6f4ef"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f3d46">Heatwave Intelligence - microservice architecture (KJS-CES-01)</text>

  <rect x="330" y="46" width="300" height="62" rx="8" fill="#fff" stroke="#1f5f6b" stroke-width="2"/>
  <text x="480" y="70" text-anchor="middle" font-weight="bold">React + Vite dashboard  :5173</text>
  <text x="480" y="90" text-anchor="middle" fill="#5d6b70">Overview · Map (Leaflet) · Charts (Recharts) · Advisory</text>

  <line x1="480" y1="108" x2="480" y2="150" stroke="#34505a" stroke-width="2" marker-end="url(#a)"/>
  <text x="490" y="134" fill="#5d6b70">REST/JSON  /api/*</text>

  <rect x="330" y="152" width="300" height="62" rx="8" fill="#0f3d46"/>
  <text x="480" y="178" text-anchor="middle" fill="#fff" font-weight="bold">API Gateway (FastAPI)  :8000</text>
  <text x="480" y="198" text-anchor="middle" fill="#a9c4c4">routing · aggregation · 503 on failure</text>

  <g stroke="#34505a" stroke-width="2" marker-end="url(#a)">
    <line x1="380" y1="214" x2="130" y2="300"/><line x1="440" y1="214" x2="340" y2="300"/>
    <line x1="520" y1="214" x2="620" y2="300"/><line x1="580" y1="214" x2="830" y2="300"/>
  </g>

  <rect x="20" y="302" width="220" height="130" rx="8" fill="#fff" stroke="#1f5f6b" stroke-width="2"/>
  <text x="130" y="326" text-anchor="middle" font-weight="bold">Data Service :8001</text>
  <text x="130" y="348" text-anchor="middle" fill="#5d6b70">Phase I + III</text>
  <text x="130" y="368" text-anchor="middle" fill="#5d6b70">CSV load · validation</text>
  <text x="130" y="386" text-anchor="middle" fill="#5d6b70">quality report · filters</text>
  <text x="130" y="404" text-anchor="middle" fill="#7a1f3d">simulated AWS ingest</text>

  <rect x="250" y="302" width="220" height="130" rx="8" fill="#fff" stroke="#1f5f6b" stroke-width="2"/>
  <text x="360" y="326" text-anchor="middle" font-weight="bold">Analytics Service :8002</text>
  <text x="360" y="348" text-anchor="middle" fill="#5d6b70">Phase II + IV</text>
  <text x="360" y="368" text-anchor="middle" fill="#5d6b70">climatology · risk index</text>
  <text x="360" y="386" text-anchor="middle" fill="#5d6b70">Ridge forecast + baselines</text>
  <text x="360" y="404" text-anchor="middle" fill="#5d6b70">metrics · AWS validation</text>

  <rect x="490" y="302" width="220" height="130" rx="8" fill="#fff" stroke="#1f5f6b" stroke-width="2"/>
  <text x="600" y="326" text-anchor="middle" font-weight="bold">Geo Service :8003</text>
  <text x="600" y="348" text-anchor="middle" fill="#5d6b70">Hotspots + mapping</text>
  <text x="600" y="368" text-anchor="middle" fill="#5d6b70">GeoJSON (observed /</text>
  <text x="600" y="386" text-anchor="middle" fill="#5d6b70">predicted / historical)</text>
  <text x="600" y="404" text-anchor="middle" fill="#5d6b70">DBSCAN clusters · ranking</text>

  <rect x="730" y="302" width="210" height="130" rx="8" fill="#fff" stroke="#1f5f6b" stroke-width="2"/>
  <text x="835" y="326" text-anchor="middle" font-weight="bold">Advisory Service :8004</text>
  <text x="835" y="348" text-anchor="middle" fill="#5d6b70">Phase V</text>
  <text x="835" y="368" text-anchor="middle" fill="#5d6b70">4 stakeholder templates</text>
  <text x="835" y="386" text-anchor="middle" fill="#5d6b70">optional LLM + fallback</text>
  <text x="835" y="404" text-anchor="middle" fill="#5d6b70">human review status</text>

  <g stroke="#7a6a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" fill="none">
    <path d="M360,302 C 300,270 200,270 150,302"/>
    <path d="M600,302 C 560,262 440,262 400,302"/>
  </g>
  <text x="255" y="262" fill="#7a6a2a" font-size="11">analytics pulls data</text>
  <text x="470" y="256" fill="#7a6a2a" font-size="11">geo pulls analytics</text>

  <rect x="20" y="470" width="220" height="96" rx="8" fill="#fdf6df" stroke="#d9a21b"/>
  <text x="130" y="494" text-anchor="middle" font-weight="bold">data/sample_tmax.csv</text>
  <text x="130" y="514" text-anchor="middle" fill="#5d6b70">SYNTHETIC sample (not IMD)</text>
  <text x="130" y="532" text-anchor="middle" fill="#5d6b70">swap: IMD GRD → CSV converter</text>
  <text x="130" y="550" text-anchor="middle" fill="#5d6b70">imdpune.gov.in/lrfindex.php</text>
  <line x1="130" y1="470" x2="130" y2="432" stroke="#34505a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="730" y="470" width="210" height="96" rx="8" fill="#fdeef3" stroke="#c46f8a"/>
  <text x="835" y="494" text-anchor="middle" font-weight="bold">Anthropic API (optional)</text>
  <text x="835" y="514" text-anchor="middle" fill="#5d6b70">only if ANTHROPIC_API_KEY set;</text>
  <text x="835" y="532" text-anchor="middle" fill="#5d6b70">otherwise rule-based templates</text>
  <line x1="835" y1="470" x2="835" y2="432" stroke="#34505a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <rect x="290" y="470" width="380" height="96" rx="8" fill="#fdeef3" stroke="#c46f8a"/>
  <text x="480" y="494" text-anchor="middle" font-weight="bold">Simulated IoT AWS (no hardware deployed)</text>
  <text x="480" y="514" text-anchor="middle" fill="#5d6b70">POST /aws/simulate or /aws/readings → Data Service</text>
  <text x="480" y="532" text-anchor="middle" fill="#5d6b70">Analytics compares +1-day forecasts with AWS readings</text>
  <text x="480" y="550" text-anchor="middle" fill="#5d6b70">All readings labelled SIMULATED</text>
  <line x1="400" y1="470" x2="150" y2="425" stroke="#34505a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
